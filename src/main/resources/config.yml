island_permission: "skyblocks.command.island"
look_island_permission: "skyblocks.command.look_island"
touch_island_permission: "skyblocks.touch_island"
auto_save_internal: 1200 # 20 * 60 = 1200 = 60 seconds

# Available providers: json, mongo, mysql, sqlite
provider: "json"

mongo.uri: "mongodb://localhost:27017/"
mongo.database: "database"

mysql:
  url: "jdbc:mysql://localhost:3306/database"
  user: "root"
  password: "password"

# Allay uses namespaced identifiers: "minecraft:item_name:count"
chest_contents:
  - "minecraft:cactus:3"
  - "minecraft:wheat_seeds:3"
  - "minecraft:pumpkin_seeds:3"
  - "minecraft:melon_seeds:3"
  - "minecraft:beetroot_seeds:3"
  - "minecraft:ice:2"
  - "minecraft:lava_bucket:1"
  - "minecraft:bread:16"
